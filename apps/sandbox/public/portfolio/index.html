<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Projects</title>
    <style>
      :root {
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: #e5e5ea;
        --brand: #4f46e5;
        --canvas: #f5f5f7;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font:
          16px/1.6 system-ui,
          'Segoe UI',
          Tahoma,
          sans-serif;
      }
      main {
        max-width: 60rem;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 1.8rem;
      }
      h2 {
        margin: 0;
        font-size: 1.25rem;
      }
      .muted {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        flex: none;
        border-radius: 50%;
        background: var(--brand);
        color: #fff;
        font-size: 1.8rem;
        font-weight: 700;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
      }
      iframe {
        width: 100%;
        height: 22rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }
      .code {
        margin: 0;
        max-height: 18rem;
        overflow: auto;
        padding: 12px;
        border-radius: 12px;
        background: var(--canvas);
        text-align: left;
        font:
          14px/1.5 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      textarea {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font:
          14px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      button {
        align-self: flex-start;
        min-height: 44px;
        padding: 8px 20px;
        border: 1px solid var(--brand);
        border-radius: 12px;
        background: #fff;
        color: var(--brand);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .note {
        padding: 16px;
        border-radius: 12px;
        background: #eef2ff;
      }
      .note.error {
        background: #fee2e2;
      }
      footer {
        text-align: center;
      }
      a {
        color: var(--brand);
        font-weight: 600;
      }
      :focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script src="/portfolio.js"></script>
  </body>
</html>
