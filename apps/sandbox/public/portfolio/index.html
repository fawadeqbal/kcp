<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Projects</title>
    <style>
      /* The Organic design system (packages/ui/src/theme.css), light and dark. */
      :root {
        --ink: #201e1d;
        --muted: #645c50;
        --line: rgba(32, 30, 29, 0.14);
        --brand: #c67139;
        --brand-text: #8c491a;
        --primary: #a05626;
        --on-primary: #fffaf3;
        --canvas: #f5ead8;
        --surface: #ebddc5;
        --raised: #f9f4ed;
        --tint: #fff2eb;
        --danger-soft: #fbe3dc;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2e8d8;
          --muted: #b9ae9c;
          --line: rgba(242, 232, 216, 0.13);
          --brand: #e08d55;
          --brand-text: #f6a06b;
          --primary: #e08d55;
          --on-primary: #1a1815;
          --canvas: #1a1815;
          --surface: #25221e;
          --raised: #2e2a25;
          --tint: #3a2213;
          --danger-soft: #3d1f1b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font:
          16px/1.6 system-ui,
          'Segoe UI',
          Tahoma,
          sans-serif;
      }
      main {
        max-width: 60rem;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      h1,
      h2 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
      }
      h1 {
        font-size: 2rem;
      }
      h2 {
        font-size: 1.35rem;
      }
      .muted {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        flex: none;
        border-radius: 50%;
        background: var(--primary);
        color: var(--on-primary);
        font-size: 1.8rem;
        font-weight: 700;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 22px;
        border-radius: 32px;
        background: var(--surface);
      }
      iframe {
        width: 100%;
        height: 22rem;
        border: 0;
        border-radius: 20px;
        background: #fff;
      }
      .code {
        margin: 0;
        max-height: 18rem;
        overflow: auto;
        padding: 14px 16px;
        border-radius: 20px;
        background: var(--raised);
        text-align: left;
        font:
          14px/1.5 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      textarea {
        width: 100%;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--raised);
        color: var(--ink);
        font:
          14px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      button {
        align-self: flex-start;
        min-height: 44px;
        padding: 8px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 6px 16px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font-size: 0.9rem;
      }
      button svg {
        width: 1em;
        height: 1em;
        flex: none;
      }
      /* A project's card: its name and details beside the "Full screen" button. */
      .card-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .card-head > div {
        min-width: 0;
        flex: 1;
      }
      .card-head button {
        flex: none;
      }
      .card.is-full {
        position: fixed;
        inset: 0;
        z-index: 10;
        width: 100%;
        height: 100dvh;
        overflow-y: auto;
        border-radius: 0;
        background: var(--canvas);
      }
      /* Block projects: Bit's world, and the buttons that play it. */
      .stage {
        height: 22rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .card.is-full .stage,
      .card.is-full iframe,
      .card.is-full .code {
        flex: 1;
        min-height: 0;
        height: auto;
        max-height: none;
      }
      html.covered {
        overflow: hidden;
      }
      .note {
        padding: 16px 20px;
        border-radius: 22px;
        background: var(--tint);
      }
      .note.error {
        background: var(--danger-soft);
      }
      footer {
        text-align: center;
      }
      a {
        color: var(--brand-text);
        font-weight: 600;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script src="/portfolio.js"></script>
  </body>
</html>
