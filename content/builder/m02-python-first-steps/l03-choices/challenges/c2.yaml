    # Add an elif for "warm" (above 15) and an else for "cold".
solution:
  py: |
    temperature = int(input("How hot is it today? "))
    if temperature > 30:
        print("It's hot! Drink lots of water.")
    elif temperature > 15:
        print("It's warm. Perfect for football!")
    else:
        print("It's cold. Wear a jacket!")
