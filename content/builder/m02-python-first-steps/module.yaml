descriptions:
  en: Write your first Python programs — they talk, ask questions and make choices — and build a text adventure.
  ar: اكتب أول برامجك بلغة بايثون — برامج تتكلم وتسأل وتختار — واصنع مغامرة نصية.
  ur: پائتھن میں اپنے پہلے پروگرام لکھیں — جو بولتے ہیں، سوال پوچھتے ہیں اور فیصلے کرتے ہیں — اور ایک ٹیکسٹ ایڈونچر بنائیں۔
