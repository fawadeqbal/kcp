id: pro-m01-l02-c1
order: 1
type: git
xp: 10
repo:
  files:
    index.html: |
      <h1>Space facts</h1>
      <p>The Moon is about 384,000 km away.</p>
    style.css: |
      body { background-color: midnightblue; color: white; }
  setup:
    - run: git init
starter:
  git: []
solution:
  git:
    - run: git add index.html
    - run: git commit -m "Add the space facts page"
    - run: git add style.css
    - run: git commit -m "Add night-sky colours"
checks:
  - id: two-commits
    expect: git
    commits: 2
    hint: one_by_one
  - id: both-files
    expect: git
    committed: [index.html, style.css]
    hint: both
  - id: clean
    expect: git
    clean: true
    hint: status
