id: explorer-m01
order: 1
titles:
  en: Meet Bit
  ar: تعرّف على بِت
  ur: بِٹ سے ملیے
descriptions:
  en:
    'Snap blocks together to guide Bit the robot: walk, collect gems, repeat, decide — then build your
    own game.'
  ar: 'ركّب المكعبات معًا لتوجّه الروبوت بِت: يمشي ويجمع الجواهر ويكرّر ويقرّر — ثم اصنع لعبتك الخاصة.'
  ur: 'بلاکس جوڑ کر روبوٹ بِٹ کو راستہ دکھائیں: چلنا، جوہر اٹھانا، دہرانا، فیصلہ کرنا — پھر اپنا گیم بنائیں۔'
