  - id: b
    text:
      en: A block that collects gems.
      ar: مكعب يجمع الجواهر.
      ur: ایک بلاک جو جوہر اٹھاتا ہے۔
  - id: c
    text:
      en: The flag at the end of the path.
      ar: العلم في نهاية الطريق.
      ur: راستے کے آخر میں جھنڈا۔
answer: a
explanation:
  en: A bug is a mistake in a program. Debugging means finding it and fixing it.
  ar: الخطأ البرمجي غلطة في البرنامج. تصحيح الأخطاء يعني إيجادها وإصلاحها.
  ur: بگ پروگرام میں غلطی ہے۔ ڈیبگنگ کا مطلب ہے اسے ڈھونڈنا اور ٹھیک کرنا۔
