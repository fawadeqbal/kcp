  ar: 'كل مكعب ينقل بِت مربعًا واحدًا: يمين، يمين، ثم أسفل.'
  ur: 'ہر بلاک بِٹ کو ایک خانہ لے جاتا ہے: دائیں، دائیں، پھر نیچے۔'
