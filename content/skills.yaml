# Every skill a lesson can teach (lesson.yaml: skills: [key, …]). Students and
# parents see them on the skill map; the weekly report names the new ones.
skills:
  - key: sequencing
    category: logic
    names:
      en: Steps in order
      ar: خطوات بالترتيب
      ur: ترتیب سے قدم
  - key: loops
    category: logic
    names:
      en: Repeating (loops)
      ar: التكرار (الحلقات)
      ur: دہرانا (لوپس)
  - key: conditions
    category: logic
    names:
      en: Decisions (if)
      ar: القرارات (إذا)
      ur: فیصلے (اگر)
  - key: events
    category: logic
    names:
      en: Events
      ar: الأحداث
      ur: ایونٹس
  - key: variables
    category: logic
    names:
      en: Variables
      ar: المتغيرات
      ur: متغیرات
  - key: html
    category: web
    names:
      en: Web pages (HTML)
      ar: صفحات الويب (HTML)
      ur: ویب صفحات (HTML)
  - key: links-images
    category: web
    names:
      en: Links and images
      ar: الروابط والصور
      ur: لنکس اور تصویریں
  - key: css-style
    category: web
